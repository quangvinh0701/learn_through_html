# =============================================================
# Lab 13 — Local data stack: Postgres + MinIO + Prometheus + Grafana
# Trích & chuyển thể từ 13-docker-kubernetes-masterclass.html
#   (Module 6 "docker-compose.data-stack.yml" + block profiles có Prometheus).
# KHÔNG lấy phần Kubernetes manifests của bài — chỉ phần Compose.
# Đã bổ sung: Grafana (bài chỉ có Grafana ở phần K8s), prometheus.yml,
#   healthcheck cho từng service, volume named, provision datasource Grafana.
#
# CHƯA chạy trên Docker thật (sandbox không có daemon). YAML đã validate.
# =============================================================

services:
  # ── PostgreSQL ──
  postgres:
    image: postgres:16-alpine          # PIN: nhánh 16
    container_name: stack-postgres
    environment:
      POSTGRES_USER: labuser
      POSTGRES_PASSWORD: labpass
      POSTGRES_DB: labdb
    ports:
      - "5432:5432"
    volumes:
      - ./init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labuser -d labdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [data-net]

  # ── MinIO (S3-compatible object store, có Console UI) ──
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z   # PIN: bản tháng 4/2025
    # ^ Chọn có chủ đích: các RELEASE mới hơn (giữa 2025) đã LƯỢC BỎ Console UI
    #   khỏi image community. Tag này còn Console ở cổng 9001 để làm bài "tạo bucket".
    container_name: stack-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"      # S3 API
      - "9001:9001"      # Console UI (trình duyệt)
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [data-net]

  # ── Prometheus (thu thập metric) ──
  prometheus:
    image: prom/prometheus:v2.53.5     # PIN: nhánh LTS v2.53
    container_name: stack-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [data-net]

  # ── Grafana (dashboard) ──
  grafana:
    image: grafana/grafana:11.6.16     # PIN: nhánh 11.x
    container_name: stack-grafana
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafanadata:/var/lib/grafana
      # Provision sẵn datasource Prometheus để vào là dùng được ngay.
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [data-net]

  # ── (TÙY CHỌN) postgres-exporter: xuất metric của Postgres cho Prometheus ──
  # Bỏ comment để có metric DB thật trong Grafana (và bỏ comment job tương ứng
  # trong prometheus/prometheus.yml). Ảnh trên quay.io — nếu kéo lỗi thì đó là
  # phần "debug là bài học".
  # postgres-exporter:
  #   image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
  #   container_name: stack-pg-exporter
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   environment:
  #     DATA_SOURCE_NAME: "postgresql://labuser:labpass@postgres:5432/labdb?sslmode=disable"
  #   ports:
  #     - "9187:9187"
  #   networks: [data-net]

networks:
  data-net:
    driver: bridge

volumes:
  pgdata:
  miniodata:
  promdata:
  grafanadata:
