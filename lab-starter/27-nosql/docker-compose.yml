# =============================================================
# Lab 27 — NoSQL & Distributed Storage
# Bon he lu tru trong mot stack de so sanh TRUC TIEP:
#   redis (key-value) · mongo (document) · cassandra (wide-column)
#   · dynamodb-local (managed key-value, ban chay may)
#
# Trich & chuyen the tu 27-nosql-distributed-storage-masterclass.html
#   (Chuong 16 — Lab end-to-end). Nhung cho HTML de lung (image tag,
#   healthcheck, volume, gioi han bo nho Cassandra) da duoc dien.
#
# LUU Y TRUNG THUC: file nay CHUA chay tren Docker that trong moi truong
#   tao ra no (khong co Docker daemon). Cu phap YAML da validate bang
#   yaml.safe_load. Neu `docker compose up` bao loi -> do la bai tap:
#   doc log, sua, ghi postmortem.
#
# RAM: Cassandra mot minh an ~2 GB. Cap cho Docker toi thieu 6 GB neu bat
#   ca bon service. Chi can 2 service? Dung `docker compose up -d redis mongo`.
# =============================================================
# `version:` da bo — Compose v2 khong can va se canh bao "version is obsolete".

services:
  # ── Redis: session, gio hang, rate limit ────────────────────
  redis:
    image: redis:7-alpine            # PIN: nhanh 7, alpine (~16 MB)
    container_name: nosql-redis
    ports:
      - "6379:6379"
    # MAC DINH image nay KHONG bat AOF. Bat len de thay khac biet ve do ben:
    #   --appendonly yes            -> fsync theo everysec, mat toi da 1s
    #   bo di                       -> chi co RDB theo lich, mat toi da 60s
    # Lab Chuong 16 buoc 2d yeu cau bat/tat de do lai.
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--appendfsync"
      - "everysec"
      - "--maxmemory"
      - "256mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── MongoDB: catalog san pham, thuoc tinh khong dong nhat ───
  mongo:
    image: mongo:7.0                 # PIN: nhanh 7.0
    container_name: nosql-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpass
      MONGO_INITDB_DATABASE: shop
    volumes:
      # File .js trong thu muc nay chi chay MOT LAN, luc volume duoc khoi tao.
      # Da xoa volume roi up lai moi chay lai: `docker compose down -v`.
      - ./init/mongo-seed.js:/docker-entrypoint-initdb.d/01-seed.js:ro
      - mongo_data:/data/db
    healthcheck:
      # mongosh co san trong image mongo:6+ (mongo shell cu da bi bo).
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── Cassandra: wide-column, 1 node (RF=1) ───────────────────
  # Mot node KHONG day duoc bai hoc ve quorum va nhan ban. De lam Chuong 3
  # cho ra hon, nhan len 3 node — xem muc "Bai tap 5" trong README.
  cassandra:
    image: cassandra:4.1             # PIN: nhanh 4.1
    container_name: nosql-cassandra
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: nosql-lab
      CASSANDRA_DC: dc1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      # Gioi han heap: mac dinh Cassandra tu chon 1/4 RAM may, tren laptop
      # 32 GB no se doi 8 GB va lam treo Docker Desktop.
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 200M
    volumes:
      - cassandra_data:/var/lib/cassandra
      # Cassandra KHONG co co che tu chay script luc khoi tao (khac Postgres,
      # khac Mongo). Vi vay chi mount vao /schema roi tu chay bang cqlsh:
      #   docker exec nosql-cassandra cqlsh -f /schema/cassandra-schema.cql
      - ./init/cassandra-schema.cql:/schema/cassandra-schema.cql:ro
    healthcheck:
      # `cqlsh -e "describe keyspaces"` la kiem tra that su co ket noi duoc,
      # chac hon `nodetool status` (nodetool len truoc khi CQL san sang).
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s      # Cassandra 4.1 khoi dong cham, dung sot ruot

  # ── DynamoDB Local: ban chay may cua DynamoDB ───────────────
  dynamodb-local:
    image: amazon/dynamodb-local:2.6.1   # PIN: tag 2.x moi nhat (pushed 2025-04)
    container_name: nosql-dynamodb
    ports:
      - "8000:8000"
    # -sharedDb: MOI credential/region deu dung chung mot file DB. Khong co
    #   co, moi bo access key se tao mot file rieng va ban se "mat" bang.
    # -dbPath: ghi ra dia thay vi giu trong RAM (mac dinh -inMemory neu khong dat).
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/home/dynamodblocal/data"]
    working_dir: /home/dynamodblocal
    user: root                 # can quyen ghi vao volume gan vao /home/dynamodblocal/data
    volumes:
      - dynamodb_data:/home/dynamodblocal/data
    healthcheck:
      # Image nay KHONG co curl/wget. Dung /dev/tcp cua bash de bat tay TCP.
      # Neu bash cung khong co trong image ban keo ve -> bo healthcheck nay di
      # va dua depends_on ve `condition: service_started`.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8000' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  redis_data:
  mongo_data:
  cassandra_data:
  dynamodb_data:
