# =============================================================
# Lab 11 — CDC: PostgreSQL -> Debezium -> Kafka
# Trích & chuyển thể từ 11-streaming-data-api-masterclass.html
#   (Module 3 "docker-compose — Kafka + Debezium + Postgres"
#    và Module 13 Lab "docker-compose.yml").
# Đã điền các chỗ HTML để lửng: image tag pin cụ thể, healthcheck,
#   depends_on: condition: service_healthy, named volume, init mount.
#
# LƯU Ý: file này CHƯA chạy trên Docker thật trong sandbox (không có
#   Docker daemon). Cú pháp YAML đã validate tự động. Nếu gặp lỗi khi
#   `docker compose up` -> đó là bài tập: đọc log, sửa, ghi postmortem.
# =============================================================
# `version:` đã bỏ — Compose v2 (Docker Desktop hiện tại) không cần,
# và sẽ cảnh báo "version is obsolete" nếu khai báo.

services:
  # ── PostgreSQL (source DB, bật logical replication cho CDC) ──
  postgres:
    image: postgres:16-alpine          # PIN: nhánh 16, alpine cho nhẹ
    container_name: cdc-postgres
    environment:
      POSTGRES_DB: labdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    # wal_level=logical là BẮT BUỘC để Debezium đọc WAL.
    # Dạng multi-token (mỗi "-c" và giá trị là 1 phần tử) — dạng đúng;
    # bản trong HTML gộp "-c wal_level=logical" thành 1 token dễ lỗi parse.
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"
    ports:
      - "5432:5432"
    volumes:
      - ./init:/docker-entrypoint-initdb.d:ro   # 01-init.sql chạy 1 lần khi khởi tạo volume
      - cdc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d labdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── ZooKeeper ───────────────────────────────────────────────
  # VÌ SAO CÒN ZOOKEEPER? Kafka 3.3+ có KRaft (bỏ ZK), Kafka 4.0 bỏ hẳn ZK.
  # Nhưng image confluentinc/cp-kafka 7.6.x cấu hình dual-listener kiểu này
  # vẫn chạy ổn định nhất ở chế độ ZK cho lab 1 node. Muốn KRaft: xem Module 14
  # (KRaft) trong bài — cần đổi env sang process.roles=broker,controller.
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.12
    container_name: cdc-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  # ── Kafka (dual-listener) ───────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.12
    container_name: cdc-kafka
    depends_on:
      zookeeper:
        condition: service_started
    ports:
      - "9092:9092"        # client từ HOST nối qua listener PLAINTEXT_HOST
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # ⭐ DUAL LISTENER — điểm mấu chốt đã vá trong bài:
      #   PLAINTEXT (nội bộ compose, cổng 29092): container khác nối qua "kafka:29092"
      #   PLAINTEXT_HOST (cổng 9092): tiến trình trên máy host nối qua "localhost:9092"
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # ── Kafka Connect + Debezium ────────────────────────────────
  kafka-connect:
    image: debezium/connect:2.7.3.Final   # PIN: Debezium 2.7 (nhánh ổn định)
    container_name: cdc-connect
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8083:8083"        # REST API của Kafka Connect (đăng ký connector qua đây)
    environment:
      BOOTSTRAP_SERVERS: kafka:29092     # nối tới listener NỘI BỘ, không phải 9092
      GROUP_ID: lab-connect
      CONFIG_STORAGE_TOPIC: lab_connect_configs
      OFFSET_STORAGE_TOPIC: lab_connect_offsets
      STATUS_STORAGE_TOPIC: lab_connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/connectors || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ── (TÙY CHỌN) Kafka UI — soi topic/message bằng trình duyệt ──
  # Bỏ comment để bật. UI ở http://localhost:8085
  # kafka-ui:
  #   image: provectuslabs/kafka-ui:v0.7.2
  #   container_name: cdc-kafka-ui
  #   depends_on:
  #     kafka:
  #       condition: service_healthy
  #   ports:
  #     - "8085:8080"
  #   environment:
  #     KAFKA_CLUSTERS_0_NAME: lab
  #     KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
  #     KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: connect
  #     KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083
  #     DYNAMIC_CONFIG_ENABLED: "true"
  #
  # (thay thế) redpanda-console cũng làm được việc tương tự:
  #   image: docker.redpanda.com/redpandadata/console:v2.7.2
  #   environment:
  #     KAFKA_BROKERS: kafka:29092
  #     CONNECT_ENABLED: "true"
  #     CONNECT_CLUSTERS_NAME: connect
  #     CONNECT_CLUSTERS_URL: http://kafka-connect:8083

volumes:
  cdc_pgdata:
