# =============================================================
# Lab 12 — Airflow 3.x standalone (KISS)
# Trích & chuyển thể từ 12-airflow-orchestration-masterclass.html
#   (Module 13 "Docker Compose dev environment").
# Bản gốc trong bài dùng webserver + scheduler + airflow-init RIÊNG.
#   Ở đây rút gọn còn 1 container chạy `airflow standalone` + 1 Postgres
#   metadata — KISS, KHÔNG CeleryExecutor, đủ để học DAG/Assets.
#
# CHƯA chạy trên Docker thật (sandbox không có daemon). YAML đã validate.
# =============================================================

services:
  # ── Postgres: metadata DB của Airflow ──
  postgres:
    image: postgres:16-alpine
    container_name: airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Airflow: một container chạy tất cả (api-server + scheduler +
  #    dag-processor + triggerer) qua lệnh `airflow standalone` ──
  airflow:
    image: apache/airflow:3.0.3          # PIN: Airflow 3.0.3 (Task SDK / Assets)
    container_name: airflow-standalone
    depends_on:
      postgres:
        condition: service_healthy
    command: standalone                  # entrypoint chạy `airflow standalone`
    ports:
      - "8080:8080"                      # UI + API server
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      # Fernet cố định để restart không mất mã hoá connection/variable.
      # (Dev key — ĐỪNG tái sử dụng trên production.)
      AIRFLOW__CORE__FERNET_KEY: "UKMzEm3yIuFYEq1y3-2FxPNWSVwRSSng-0kjPpUQ_0k="
      TZ: "Asia/Ho_Chi_Minh"
    volumes:
      - ./dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
    # user airflow trong image là UID 50000; nhóm 0 để ghi được volume mount.
    user: "50000:0"
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\" || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s

volumes:
  airflow_pgdata:
  airflow_logs:
